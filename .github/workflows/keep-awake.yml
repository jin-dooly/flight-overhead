name: 서버 상태 확인

# 배포 서버(/health)를 손으로 한 번 불러 보는 용도예요. Actions 화면의 Run workflow 버튼으로 실행해요.
# 서버 깨워 두기는 cron-job.org에서 10분마다 해요(README 참고).
# 처음에는 여기서 예약 실행(schedule)으로 깨웠지만, GitHub 예약 실행이 몇 시간씩 밀려 서버가 계속 잠들어서 옮겼어요.
on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # 잠든 서버는 깨어나는 데 1분 가까이 걸려서 응답 대기를 넉넉히 둠. 실패하면 30초 뒤 한 번 더
      - name: 서버 상태 확인
        run: |
          curl -fsS -m 90 https://flight-overhead.onrender.com/health \
            || (sleep 30 && curl -fsS -m 90 https://flight-overhead.onrender.com/health)
