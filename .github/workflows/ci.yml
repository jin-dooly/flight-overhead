name: CI

# main에 올리거나 PR을 열면 설치, 타입 체크, 테스트를 돌려요.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # 버전은 package.json의 packageManager를 따라요

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 타입 체크
        run: pnpm type-check

      - name: 테스트
        run: pnpm test
